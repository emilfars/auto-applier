name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoapplier
          POSTGRES_PASSWORD: autoapplier
          POSTGRES_DB: autoapplier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoapplier -d autoapplier"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Chrome for Testing
        env:
          CHROME_VERSION: 131.0.6778.85
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cft"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$GITHUB_WORKSPACE/.cft/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip"
          unzip -q "$GITHUB_WORKSPACE/.cft/chrome.zip" -d "$GITHUB_WORKSPACE/.cft"
          chmod +x "$GITHUB_WORKSPACE/.cft/chrome-linux64/chrome"
          echo "CHROME_BIN=$GITHUB_WORKSPACE/.cft/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: |
          (cd packages/fill-mappings && npm ci)
          (cd web && npm ci)
          (cd extension && npm ci)
      - name: Run verification gate
        env:
          TEST_DATABASE_URL: postgres://autoapplier:autoapplier@127.0.0.1:5432/autoapplier?sslmode=disable
        run: ./scripts/verify.sh
