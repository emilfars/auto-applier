name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoapplier
          POSTGRES_PASSWORD: autoapplier
          POSTGRES_DB: autoapplier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoapplier -d autoapplier"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: |
          (cd packages/fill-mappings && npm ci)
          (cd web && npm ci)
          (cd extension && npm ci)
      - name: Run verification gate
        env:
          TEST_DATABASE_URL: postgres://autoapplier:autoapplier@127.0.0.1:5432/autoapplier?sslmode=disable
        run: ./scripts/verify.sh
