# Auto Applier — local dev stack: Postgres + API + web.
# `docker compose up` brings up the full M0 skeleton.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoapplier
      POSTGRES_PASSWORD: autoapplier
      POSTGRES_DB: autoapplier
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapplier"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://autoapplier:autoapplier@db:5432/autoapplier?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
